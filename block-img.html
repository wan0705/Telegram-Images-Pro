<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容已被屏蔽</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root{--bg:#f5f5f5;--text:#1a1a1a;--text-secondary:#555;--border:#e0e0e0}
[data-theme="dark"]{--bg:#0d0d0d;--text:#e8e8e8;--text-secondary:#999;--border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{text-align:center;padding:40px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.icon{font-size:3rem;margin-bottom:16px}
h1{font-size:1.2rem;font-weight:600;margin-bottom:8px}
p{font-size:.85rem;color:var(--text-secondary)}
a{color:#06f;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="card"><div class="icon">&#128683;</div><h1>内容已被屏蔽</h1><p>该文件因违反相关规定已被管理员屏蔽。</p><p style="margin-top:12px"><a href="/">返回首页</a></p></div>
</body>
</html>
